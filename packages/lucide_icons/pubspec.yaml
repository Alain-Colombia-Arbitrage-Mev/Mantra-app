name: lucide_icons
version: 0.0.1
description: Local compatibility shim for Lucide icons used by the app.

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/lucide.ttf
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/lucide.ttf
