name: mandala_app
description: Mantras - Astrology & Wellness App
publish_to: 'none'
version: 3.2.0+15

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  go_router: ^17.3.0
  lucide_icons:
    path: packages/lucide_icons
  shared_preferences: ^2.5.4
  just_audio: ^0.10.6
